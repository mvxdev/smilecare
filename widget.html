<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diana — SmileCare</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body{overflow:hidden;margin:0;padding:0;box-sizing:border-box;}
*,*::before,*::after{box-sizing:border-box;}
:root{
  --g:#1a6b4a;--gl:#f0f7f4;--gm:#e0f0e9;--gd:#134f37;
  --tx:#1a1a1a;--tm:#6b7280;--th:#9ca3af;
  --bd:#e5e7eb;--bg:#fff;--sf:#f9fafb;--s2:#f3f4f6;
  --r:12px;--rs:8px;
}
body{font-family:'Inter',sans-serif;background:#fff;display:flex;flex-direction:column;height:100vh;}
.hdr{padding:14px 16px;background:#fff;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px;flex-shrink:0;}
.hdr-av{width:38px;height:38px;border-radius:50%;background:var(--gl);border:2px solid var(--gm);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;color:var(--g);flex-shrink:0;position:relative;}
.hdr-dot{position:absolute;bottom:1px;right:1px;width:8px;height:8px;background:#22c55e;border:2px solid #fff;border-radius:50%;}
.hdr-info{flex:1;}
.hdr-name{font-size:13.5px;font-weight:600;color:var(--tx);}
.hdr-sub{font-size:11px;color:var(--tm);margin-top:1px;display:flex;align-items:center;gap:4px;}
.hdr-sub::before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:#22c55e;}
.hdr-by{font-size:10px;color:var(--th);text-align:right;line-height:1.4;}
.hdr-by a{color:#2563eb;text-decoration:none;font-weight:600;}
.hdr-by a:hover{text-decoration:underline;}
.lang-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;background:#fff;}
.lang-logo{width:52px;height:52px;border-radius:50%;background:var(--gl);border:2px solid var(--gm);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:var(--g);}
.lang-title{font-size:15px;font-weight:600;color:var(--tx);text-align:center;line-height:1.5;}
.lang-sub{font-size:13px;color:var(--tm);text-align:center;line-height:1.5;}
.lang-btns{display:flex;gap:10px;margin-top:4px;}
.lang-btn{padding:10px 28px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:1.5px solid var(--g);font-family:'Inter',sans-serif;transition:all 0.15s;}
.lang-btn.ru{background:var(--g);color:#fff;}
.lang-btn.ru:hover{background:var(--gd);}
.lang-btn.ro{background:#fff;color:var(--g);}
.lang-btn.ro:hover{background:var(--gl);}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth;}
.msgs::-webkit-scrollbar{width:3px;}
.msgs::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px;}
.mrow{display:flex;gap:7px;max-width:88%;animation:mIn 0.2s ease;}
.mrow.bot{align-self:flex-start;}
.mrow.usr{align-self:flex-end;flex-direction:row-reverse;}
@keyframes mIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.mav{width:24px;height:24px;border-radius:50%;background:var(--gl);color:var(--g);font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:auto;}
.mcol{display:flex;flex-direction:column;gap:2px;}
.mbbl{padding:8px 12px;font-size:13px;line-height:1.6;word-break:break-word;}
.bot .mbbl{background:var(--sf);color:var(--tx);border-radius:3px 12px 12px 12px;border:1px solid var(--bd);}
.usr .mbbl{background:var(--g);color:#fff;border-radius:12px 3px 12px 12px;}
.mbbl strong{font-weight:600;}
.mbbl em{font-style:italic;}
.mbbl ul{margin:4px 0 4px 16px;}
.mbbl li{margin:2px 0;}
.mtime{font-size:10px;color:var(--th);padding:0 3px;}
.usr .mtime{text-align:right;}
.typing-bbl{background:var(--sf);border:1px solid var(--bd);border-radius:3px 12px 12px 12px;padding:10px 14px;display:flex;gap:4px;align-items:center;}
.tdot{width:5px;height:5px;border-radius:50%;background:var(--th);animation:tb 1.2s infinite;}
.tdot:nth-child(2){animation-delay:.2s;}
.tdot:nth-child(3){animation-delay:.4s;}
@keyframes tb{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
.ccard{background:#fff;border:1px solid var(--bd);border-radius:10px;overflow:hidden;width:220px;}
.ccard-hdr{background:var(--gl);padding:7px 12px;font-size:10px;font-weight:700;color:var(--g);letter-spacing:.4px;text-transform:uppercase;}
.ccard-body{padding:9px 12px;}
.crow{display:flex;justify-content:space-between;gap:6px;padding:3px 0;font-size:11.5px;border-bottom:1px solid var(--s2);}
.crow:last-child{border:none;}
.ck{color:var(--tm);}
.cv{color:var(--tx);font-weight:500;text-align:right;}
.cbtns{display:flex;gap:6px;padding:8px 12px;border-top:1px solid var(--bd);}
.cbtn{flex:1;padding:7px;border-radius:7px;font-size:12px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;border:none;}
.cbtn.yes{background:var(--g);color:#fff;}
.cbtn.yes:hover{background:var(--gd);}
.cbtn.yes:disabled{background:#d1fae5;color:#065f46;cursor:default;}
.cbtn.no{background:transparent;color:var(--tm);border:1px solid var(--bd);}
.cbtn.no:hover{background:var(--sf);}
.qr{display:flex;flex-wrap:wrap;gap:5px;padding:3px 14px 8px;}
.qchip{font-size:11.5px;padding:5px 11px;border:1px solid rgba(26,107,74,.18);border-radius:18px;background:var(--gl);color:var(--g);cursor:pointer;transition:all .15s;font-family:'Inter',sans-serif;font-weight:500;}
.qchip:hover{background:var(--gm);}
.inp-area{padding:9px 12px;border-top:1px solid var(--bd);display:flex;gap:7px;align-items:center;background:#fff;flex-shrink:0;}
.inp{flex:1;border:1px solid var(--bd);border-radius:20px;padding:8px 14px;font-size:13px;font-family:'Inter',sans-serif;background:var(--sf);color:var(--tx);outline:none;transition:border-color .15s;}
.inp:focus{border-color:var(--g);background:#fff;}
.inp::placeholder{color:var(--th);}
.send-btn{width:34px;height:34px;border-radius:50%;background:var(--g);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;}
.send-btn:hover{background:var(--gd);}
.send-btn svg{width:14px;height:14px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
</style>
</head>

<script>

  var now = new Date();
  var daysRo = ['duminică','luni','marți','miercuri','joi','vineri','sâmbătă'];

  var dayNameRo = daysRo[now.getDay()];

}

const T = {
  ru: {
    hdrName: 'Diana — ассистент клиники',
    hdrSub:  'онлайн · отвечаю мгновенно',
    inpPh:   'Напишите сообщение...',
    confirmHdr: 'Проверьте данные',
    yes: 'Подтвердить', yesOk: '✓ Подтверждено', no: 'Изменить',
    lbl: { s:'Услуга', t:'Время', n:'Имя', p:'Телефон' },
    qr: ['Записаться на приём','Узнать цены','Наши врачи','Адрес клиники'],
    qr2: ['Записать ещё кого-то','Другие услуги'],
    errConn: 'Ошибка соединения. Попробуйте позже.',
    operatorConnected: '👤 Оператор подключился — вам ответят вручную',
    operatorWait: '⏳ Оператор ответит вам в ближайшее время...',
    system: getSystemPromptRU()
  },
  ro: {
    hdrName: 'Diana — asistentul clinicii',
    hdrSub:  'online · răspund instant',
    inpPh:   'Scrieți mesajul...',
    confirmHdr: 'Verificați datele',
    yes: 'Confirmă', yesOk: '✓ Confirmat', no: 'Modifică',
    lbl: { s:'Serviciu', t:'Data/Ora', n:'Nume', p:'Telefon' },
    qr: ['Programare consultație','Prețuri servicii','Medicii noștri','Adresa clinicii'],
    qr2: ['Altă programare','Alte servicii'],
    errConn: 'Eroare de conexiune. Încercați mai târziu.',
    operatorConnected: '👤 Operator conectat — vă va răspunde imediat',
    operatorWait: '⏳ Operatorul va răspunde în scurt timp...',
    system: getSystemPromptRO()
  }
};

// ── State ──
var lang = 'ru';
var chatHistory = [];
var pendingBooking = null;
var convMessages = [];
var sessionId = 'sess_' + Date.now();
var bookingId = null;
var lastBookingId = null; // сохраняем для проверки human mode после сброса

// ── Polling state ──
var _lastOpCount = 0;
var _humanNotified = false;
var _wasHuman = false;
var _pollStarted = false;

var msgsEl = document.getElementById('msgs');
var inpEl  = document.getElementById('inp');
var qrEl   = document.getElementById('qr');

function timeGreeting(l) {
  var h = new Date().getHours();
  var ru = h<12?'Доброе утро':h<18?'Добрый день':h<22?'Добрый вечер':'Доброй ночи';
  var ro = h<12?'Bună dimineața':h<18?'Bună ziua':h<22?'Bună seara':'Bună noaptea';
  return l==='ru' ? ru : ro;
}

window.startChat = function(l) {
  lang = l;
  var tr = T[l];
  document.getElementById('lang-screen').style.display = 'none';
  var ca = document.getElementById('chat-area');
  ca.style.display = 'flex';
  document.getElementById('hdr-name').textContent = tr.hdrName;
  document.getElementById('hdr-sub').textContent  = tr.hdrSub;
  inpEl.placeholder = tr.inpPh;

  var greet = l === 'ru'
    ? timeGreeting('ru') + '! Я Diana, ассистент клиники SmileCare 🦷\n\nПомогу записаться на приём, отвечу на вопросы о ценах и врачах. Чем могу помочь?'
    : timeGreeting('ro') + '! Sunt Diana, asistentul clinicii SmileCare 🦷\n\nVă pot ajuta să vă programați, să aflați prețurile sau informații despre medici. Cu ce vă pot ajuta?';

  setTimeout(function() {
    showTyping();
    setTimeout(function() {
      removeTyping();
      addMsg(greet, 'bot');
      chatHistory.push({ role: 'assistant', content: greet });
      setQR(tr.qr);
      startPolling();
    }, 800);
  }, 100);
};

function renderMd(text) {
  return text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*\*\*/g,'')
    .replace(/\*\*\s*\*\*/g,'')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/\*\*/g,'')
    .replace(/^- (.+)/gm,'<li>$1</li>')
    .replace(/(<li>.*<\/li>)/gs, function(s){ return '<ul>'+s+'</ul>'; })
    .replace(/\n/g,'<br>');
}

function nowTime() {
  return new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});
}

function addMsg(text, role, extra) {
  var row = document.createElement('div');
  row.className = 'mrow ' + role;

  if (role === 'bot') {
    var av = document.createElement('div');
    av.className = 'mav'; av.textContent = 'D';
    row.appendChild(av);
  }

  var col = document.createElement('div');
  col.className = 'mcol';

  if (extra && extra.type === 'confirm') {
    var bbl = document.createElement('div');
    bbl.className = 'mbbl bot';
    bbl.style.cssText = 'padding:0;background:transparent;border:none;';
    var tr = T[lang];
    bbl.innerHTML = '<div class="ccard" id="ccard-pending">'
      + '<div class="ccard-hdr">' + tr.confirmHdr + '</div>'
      + '<div class="ccard-body">'
      + '<div class="crow"><span class="ck">' + tr.lbl.s + '</span><span class="cv">' + extra.d.service + '</span></div>'
      + '<div class="crow"><span class="ck">' + tr.lbl.t + '</span><span class="cv">' + extra.d.time + '</span></div>'
      + '<div class="crow"><span class="ck">' + tr.lbl.n + '</span><span class="cv">' + extra.d.name + '</span></div>'
      + '<div class="crow"><span class="ck">' + tr.lbl.p + '</span><span class="cv">' + extra.d.phone + '</span></div>'
      + '</div>'
      + '<div class="cbtns">'
      + '<button class="cbtn yes" id="cbtn-yes" onclick="confirmBooking(true)">' + tr.yes + '</button>'
      + '<button class="cbtn no" onclick="confirmBooking(false)">' + tr.no + '</button>'
      + '</div>'
      + '</div>';
    col.appendChild(bbl);
  } else {
    var bbl2 = document.createElement('div');
    bbl2.className = 'mbbl';
    if (role === 'bot') {
      bbl2.innerHTML = renderMd(text);
    } else {
      bbl2.textContent = text;
    }
    col.appendChild(bbl2);
  }

  var t = document.createElement('div');
  t.className = 'mtime'; t.textContent = nowTime();
  col.appendChild(t);

  row.appendChild(col);
  msgsEl.appendChild(row);
  msgsEl.scrollTop = msgsEl.scrollHeight;
  convMessages.push({ role: role, text: text, time: nowTime() });
  saveDialog();
}

function addOperatorMsg(text, time) {
  var row = document.createElement('div');
  row.className = 'mrow bot';
  row.innerHTML = '<div class="mav" style="background:#fff3cd;color:#856404;">👤</div>'
    + '<div class="mcol">'
    + '<div class="mbbl" style="background:#fff8e1;border:1px solid #fde68a;border-radius:3px 12px 12px 12px;">' + text + '</div>'
    + '<div class="mtime">' + (time||'') + '</div>'
    + '</div>';
  msgsEl.appendChild(row);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

function saveDialog() {
  try {
    var dialogs = JSON.parse(localStorage.getItem('smilecare_dialogs') || '[]');
    var idx = dialogs.findIndex(function(d){ return d.sessionId === sessionId; });
    var entry = { sessionId: sessionId, lang: lang, channel: 'widget', updatedAt: new Date().toISOString(), conversation: convMessages.slice() };
    if (idx >= 0) dialogs[idx] = entry; else dialogs.unshift(entry);
    localStorage.setItem('smilecare_dialogs', JSON.stringify(dialogs.slice(0,50)));
  } catch(e) {}
}

function showTyping() {
  var row = document.createElement('div');
  row.className = 'mrow bot'; row.id = 'typing';
  var av = document.createElement('div');
  av.className = 'mav'; av.textContent = 'D';
  row.appendChild(av);
  var b = document.createElement('div');
  b.className = 'typing-bbl';
  b.innerHTML = '<div class="tdot"></div><div class="tdot"></div><div class="tdot"></div>';
  row.appendChild(b);
  msgsEl.appendChild(row);
  msgsEl.scrollTop = msgsEl.scrollHeight;
}

function removeTyping() {
  var t = document.getElementById('typing');
  if (t) t.remove();
}

function setQR(items) {
  qrEl.innerHTML = '';
  items.forEach(function(text) {
    var btn = document.createElement('button');
    btn.className = 'qchip'; btn.textContent = text;
    btn.onclick = function(){ send(text); };
    qrEl.appendChild(btn);
  });
}

function parseBooking(text) {
  var m = text.match(/(?:ЗАПИСЬ_ГОТОВА|PROGRAMARE_GATA)[:\s]+([^|\n]+?)\s*\|\s*([^|\n]+?)\s*\|\s*([^|\n]+?)\s*\|\s*([^\n]+)/);
  if (!m) return null;
  return {
    service: m[1].trim(),
    time: m[2].trim(),
    name: m[3].trim(),
    phone: m[4].trim().replace(/[^0-9+]/g, '').slice(0, 12) || m[4].trim()
  };
}

function saveBooking(booking) {
  try {
    var stored = JSON.parse(localStorage.getItem('smilecare_bookings') || '[]');
    if (bookingId) {
      var idx = stored.findIndex(function(b){ return b.id === bookingId; });
      if (idx >= 0) {
        stored[idx] = Object.assign({}, stored[idx], booking, { conversation: convMessages.slice() });
        localStorage.setItem('smilecare_bookings', JSON.stringify(stored));
        return stored[idx];
      }
    }
    var entry = Object.assign({ id: 'bk_' + Date.now(), sessionId: sessionId, status: 'new', channel: 'widget', lang: lang, createdAt: new Date().toISOString(), conversation: convMessages.slice() }, booking);
    bookingId = entry.id;
    stored.unshift(entry);
    localStorage.setItem('smilecare_bookings', JSON.stringify(stored));
    return entry;
  } catch(e) {}
}

function updateStoredConversation() {
  saveDialog();
  if (!bookingId) return;
  try {
    var stored = JSON.parse(localStorage.getItem('smilecare_bookings') || '[]');
    var idx = stored.findIndex(function(b){ return b.id === bookingId; });
    if (idx >= 0) {
      // Preserve operator messages already in booking
      var existingOps = (stored[idx].conversation || []).filter(function(m){ return m.role === 'operator'; });
      var merged = convMessages.slice();
      existingOps.forEach(function(om) {
        var already = merged.some(function(m){ return m.role === 'operator' && m.text === om.text && m.time === om.time; });
        if (!already) merged.push(om);
      });
      stored[idx].conversation = merged;
      localStorage.setItem('smilecare_bookings', JSON.stringify(stored));
    }
  } catch(e) {}
}

// ── Human mode ──
function isHumanMode() {
  try {
    var modes = JSON.parse(localStorage.getItem('smilecare_human_modes') || '{}');
    if (bookingId && modes[bookingId]) return true;
    if (lastBookingId && modes[lastBookingId]) return true;
    if (sessionId && modes['dlg_' + sessionId]) return true;
    return false;
  } catch(e) { return false; }
}

// ── Polling ──
function startPolling() {
  if (_pollStarted) return;
  _pollStarted = true;
  setInterval(pollAdmin, 2000);
}

function pollAdmin() {
  var nowHuman = isHumanMode();

  // Banner toggle
  if (nowHuman !== _wasHuman) {
    _wasHuman = nowHuman;
    var banner = document.getElementById('hm-banner');
    if (nowHuman) {
      if (!banner) {
        banner = document.createElement('div');
        banner.id = 'hm-banner';
        banner.style.cssText = 'background:#fff8e1;border-bottom:1px solid #ffc107;padding:6px 14px;font-size:11.5px;font-weight:500;color:#856404;display:flex;align-items:center;gap:6px;flex-shrink:0;';
        banner.textContent = T[lang].operatorConnected;
        msgsEl.parentNode.insertBefore(banner, msgsEl);
      }
    } else {
      if (banner) banner.remove();
      _humanNotified = false;
    }
  }

  // Pull new operator messages from smilecare_dialogs
  try {
    var dialogs = JSON.parse(localStorage.getItem('smilecare_dialogs') || '[]');
    var entry = dialogs.find(function(d){ return d.sessionId === sessionId; });
    if (!entry) return;
    var opMsgs = (entry.conversation || []).filter(function(m){ return m.role === 'operator'; });
    if (opMsgs.length > _lastOpCount) {
      opMsgs.slice(_lastOpCount).forEach(function(m) {
        addOperatorMsg(m.text, m.time);
        chatHistory.push({ role: 'assistant', content: m.text });
      });
      _lastOpCount = opMsgs.length;
    }
  } catch(e) {}
}

// ── Send ──
async function send(text) {
  if (!text.trim()) return;
  inpEl.value = ''; // очищаем сразу
  var newBookingPhrases = ['Записать ещё кого-то','Altă programare','записать ещё','altă programare'];
  if (newBookingPhrases.some(function(p){ return text.toLowerCase().includes(p.toLowerCase()); })) {
    bookingId = null;
    sessionId = 'sess_' + Date.now();
    convMessages = [];
    _lastOpCount = 0;
    _humanNotified = false;
  }
  qrEl.innerHTML = '';
  addMsg(text, 'usr');
  chatHistory.push({ role: 'user', content: text });

  // Human mode block — молча блокируем ИИ
  if (isHumanMode()) {
    updateStoredConversation();
    return;
  }

  showTyping();
  try {
    var res = await fetch(WORKER, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: MODEL, max_tokens: 1000, system: T[lang].system, messages: chatHistory })
    });
    var data = await res.json();
    var reply = (data.content && data.content[0] && data.content[0].text) ? data.content[0].text : T[lang].errConn;
    removeTyping();
    var booking = parseBooking(reply);
    if (booking) {
      pendingBooking = booking;
      var clean = reply.replace(/(?:ЗАПИСЬ_ГОТОВА|PROGRAMARE_GATA):.*/, '').trim();
      if (clean) addMsg(clean, 'bot');
      addMsg('', 'bot', { type: 'confirm', d: booking });
    } else {
      addMsg(reply, 'bot');
    }
    chatHistory.push({ role: 'assistant', content: reply });
    updateStoredConversation();
    if (chatHistory.length <= 2) setQR(T[lang].qr);
  } catch(e) {
    removeTyping();
    addMsg(T[lang].errConn, 'bot');
    console.error('Widget fetch error:', e);
  }
}

window.confirmBooking = function(yes) {
  var tr = T[lang];
  if (yes && pendingBooking) {
    // Save booking
    saveBooking(pendingBooking);
    // Update button: green, disabled, checkmark; keep Изменить
    var yesBtn = document.getElementById('cbtn-yes');
    if (yesBtn) {
      yesBtn.textContent = '✓';
      yesBtn.disabled = true;
      yesBtn.style.cssText = 'flex:1;padding:7px;border-radius:7px;font-size:13px;font-weight:700;background:#d1fae5;color:#065f46;border:1px solid #6ee7b7;cursor:default;';
    }
    // Confirmation message
    var msg = lang === 'ru'
      ? 'Отлично, **' + pendingBooking.name + '**! Запись подтверждена.\n\nЖдём вас в SmileCare. SMS придёт на **' + pendingBooking.phone + '**. 🦷'
      : 'Excelent, **' + pendingBooking.name + '**! Programarea este confirmată.\n\nVă așteptăm la SmileCare. SMS pe **' + pendingBooking.phone + '**. 🦷';
    addMsg(msg, 'bot');
    chatHistory.push({ role: 'assistant', content: msg });
    setQR(tr.qr2);
    lastBookingId = bookingId;
    bookingId = null;
    // НЕ сбрасываем sessionId — диалог продолжается в той же сессии
    // Пересчитываем _lastOpCount чтобы не дублировать уже показанные operator-msgs
    try {
      var dlgs = JSON.parse(localStorage.getItem('smilecare_dialogs') || '[]');
      var dlgE = dlgs.find(function(d){ return d.sessionId === sessionId; });
      _lastOpCount = dlgE && dlgE.conversation ? dlgE.conversation.filter(function(m){ return m.role === 'operator'; }).length : 0;
    } catch(e) { _lastOpCount = 0; }
    _humanNotified = false;
  } else {
    addMsg(lang === 'ru' ? 'Конечно! Что хотите изменить?' : 'Desigur! Ce doriți să modificați?', 'bot');
    chatHistory.push({ role: 'assistant', content: lang === 'ru' ? 'Конечно! Что хотите изменить?' : 'Desigur! Ce doriți să modificați?' });
  }
  pendingBooking = null;
};

// Очищаем устаревшие human modes при загрузке (старые сессии)
(function() {
  try {
    var modes = JSON.parse(localStorage.getItem('smilecare_human_modes') || '{}');
    var dialogs = JSON.parse(localStorage.getItem('smilecare_dialogs') || '[]');
    var bookings = JSON.parse(localStorage.getItem('smilecare_bookings') || '[]');
    var validIds = new Set();
    dialogs.forEach(function(d){ validIds.add('dlg_' + d.sessionId); });
    bookings.forEach(function(b){ validIds.add(b.id); });
    var cleaned = {};
    Object.keys(modes).forEach(function(k){ if(validIds.has(k)) cleaned[k] = modes[k]; });
    localStorage.setItem('smilecare_human_modes', JSON.stringify(cleaned));
  } catch(e) {}
})();

inpEl.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); send(inpEl.value); } });
document.getElementById('send-btn').onclick = function() { send(inpEl.value); };

(function() {
  var h = new Date().getHours();
  var ru = h<12?'Доброе утро':h<18?'Добрый день':h<22?'Добрый вечер':'Доброй ночи';
  var ro = h<12?'Bună dimineața':h<18?'Bună ziua':h<22?'Bună seara':'Bună noaptea';
  document.getElementById('ls-title').innerHTML = ru + '! 👋<br>' + ro + '! 👋';
})();
</script>
