<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diana — SmileCare</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#1a6b4a;--green-light:#f0f7f4;--green-mid:#e0f0e9;--green-dark:#134f37;
  --text:#1a1a1a;--text-muted:#6b7280;--text-hint:#9ca3af;
  --border:#e5e7eb;--bg:#ffffff;--surface:#f9fafb;--surface2:#f3f4f6;
  --radius:12px;--shadow-lg:0 8px 32px rgba(0,0,0,0.12);
}
body{font-family:'Inter',sans-serif;background:#f0f2f5;display:flex;align-items:center;justify-content:center;min-height:100vh;}
.chat-widget{width:360px;height:580px;background:#fff;border-radius:20px;box-shadow:var(--shadow-lg),0 0 0 1px rgba(0,0,0,0.04);display:flex;flex-direction:column;overflow:hidden;}
.chat-header{padding:16px 18px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;}
.chat-header-avatar{width:40px;height:40px;border-radius:50%;background:var(--green-light);border:2px solid var(--green-mid);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;color:var(--green);flex-shrink:0;position:relative;}
.online-dot{position:absolute;bottom:1px;right:1px;width:9px;height:9px;background:#22c55e;border:2px solid #fff;border-radius:50%;}
.chat-header-info{flex:1;}
.chat-header-name{font-size:14px;font-weight:600;color:var(--text);}
.chat-header-sub{font-size:11px;color:var(--text-muted);margin-top:1px;display:flex;align-items:center;gap:4px;}
.chat-header-sub::before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:#22c55e;}
.chat-header-powered{font-size:10px;color:var(--text-hint);text-align:right;line-height:1.4;}
.chat-messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth;}
.chat-messages::-webkit-scrollbar{width:4px;}
.chat-messages::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.msg-row{display:flex;gap:8px;max-width:88%;animation:msgIn 0.2s ease;}
.msg-row.user{align-self:flex-end;flex-direction:row-reverse;}
.msg-row.bot{align-self:flex-start;}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg-avatar{width:26px;height:26px;border-radius:50%;background:var(--green-light);color:var(--green);font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:auto;}
.msg-content{display:flex;flex-direction:column;gap:2px;}
.msg-bubble{padding:9px 13px;font-size:13.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;}
.bot .msg-bubble{background:var(--surface);color:var(--text);border-radius:4px 14px 14px 14px;border:1px solid var(--border);}
.user .msg-bubble{background:var(--green);color:#fff;border-radius:14px 4px 14px 14px;}
.msg-time{font-size:10px;color:var(--text-hint);padding:0 4px;}
.user .msg-time{text-align:right;}
.typing-bubble{background:var(--surface);border:1px solid var(--border);border-radius:4px 14px 14px 14px;padding:11px 14px;display:flex;gap:4px;align-items:center;}
.typing-dot{width:5px;height:5px;border-radius:50%;background:var(--text-hint);animation:typingBounce 1.2s infinite;}
.typing-dot:nth-child(2){animation-delay:0.2s;}
.typing-dot:nth-child(3){animation-delay:0.4s;}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:0.5}30%{transform:translateY(-4px);opacity:1}}
.confirm-card{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-top:4px;width:220px;}
.confirm-card-header{background:var(--green-light);padding:8px 12px;font-size:11px;font-weight:600;color:var(--green);letter-spacing:0.3px;text-transform:uppercase;}
.confirm-card-body{padding:10px 12px;}
.confirm-row{display:flex;justify-content:space-between;gap:8px;padding:4px 0;font-size:12px;border-bottom:1px solid var(--surface2);}
.confirm-row:last-child{border-bottom:none;}
.confirm-row .ck{color:var(--text-muted);}
.confirm-row .cv{color:var(--text);font-weight:500;text-align:right;}
.confirm-actions{display:flex;gap:6px;padding:8px 12px;border-top:1px solid var(--border);}
.btn-yes{flex:1;padding:7px;background:var(--green);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;}
.btn-yes:hover{background:var(--green-dark);}
.btn-no{flex:1;padding:7px;background:transparent;color:var(--text-muted);border:1px solid var(--border);border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;}
.btn-no:hover{background:var(--surface);}
.quick-replies{display:flex;flex-wrap:wrap;gap:6px;padding:4px 16px 10px;}
.qr-chip{font-size:12px;padding:5px 11px;border:1px solid rgba(26,107,74,0.15);border-radius:20px;background:var(--green-light);color:var(--green);cursor:pointer;transition:all 0.15s;font-family:'Inter',sans-serif;font-weight:500;}
.qr-chip:hover{background:var(--green-mid);}
.chat-input-area{padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;background:#fff;}
.chat-input{flex:1;border:1px solid var(--border);border-radius:22px;padding:9px 15px;font-size:13px;font-family:'Inter',sans-serif;background:var(--surface);color:var(--text);outline:none;transition:border-color 0.15s;}
.chat-input:focus{border-color:var(--green);background:#fff;}
.chat-input::placeholder{color:var(--text-hint);}
.chat-send{width:36px;height:36px;border-radius:50%;background:var(--green);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.15s;}
.chat-send:hover{background:var(--green-dark);}
.chat-send svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
</style>
</head>
<body>
<div class="chat-widget">
  <div class="chat-header">
    <div class="chat-header-avatar">D<div class="online-dot"></div></div>
    <div class="chat-header-info">
      <div class="chat-header-name">Diana — ассистент клиники</div>
      <div class="chat-header-sub">онлайн · отвечаю мгновенно</div>
    </div>
    <div class="chat-header-powered">by<br>MX Systems</div>
  </div>
  <div class="chat-messages" id="chat-messages"></div>
  <div class="quick-replies" id="quick-replies"></div>
  <div class="chat-input-area">
    <input type="text" class="chat-input" id="chat-input" placeholder="Напишите сообщение..."/>
    <button class="chat-send" id="send-btn">
      <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
</div>
<script>
const WORKER='https://smilecare-proxy.badmvx7.workers.dev';
const SYSTEM=`Ты — Diana, AI-ассистент стоматологической клиники SmileCare в Кишинёве. Помогаешь пациентам записаться на приём. Отвечай кратко (2-4 предложения), тепло, профессионально.

Услуги и цены:
- Консультация и осмотр: 150 MDL
- Профессиональная чистка: 800 MDL
- Лечение кариеса: 600-1200 MDL
- Имплант: от 12 000 MDL
- Брекеты: от 18 000 MDL
- Отбеливание: 2 500 MDL

Врачи:
- Dr. Marina Cebotari — терапевт, пн/ср/пт 9:00-18:00
- Dr. Andrei Lungu — хирург/имплантолог, вт/чт 10:00-19:00
- Dr. Elena Munteanu — ортодонт, пн-пт 14:00-20:00

Адрес: ул. Штефан чел Маре 50, Кишинёв. Тел: +373 22 123 456

Для записи нужно собрать: 1) услугу, 2) день/время, 3) имя, 4) телефон.
Когда все 4 — выведи: ЗАПИСЬ_ГОТОВА: [услуга] | [день время] | [имя] | [телефон]
Если пишут на румынском — отвечай на румынском.`;

let history=[], pendingBooking=null, convMessages=[];
const msgsEl=document.getElementById('chat-messages');
const inputEl=document.getElementById('chat-input');
const qrEl=document.getElementById('quick-replies');

function now(){return new Date().toLocaleTimeString('ru',{hour:'2-digit',minute:'2-digit'});}

function addMsg(text,role,extra){
  const row=document.createElement('div');
  row.className=`msg-row ${role}`;
  if(role==='bot'){const av=document.createElement('div');av.className='msg-avatar';av.textContent='D';row.appendChild(av);}
  const col=document.createElement('div');col.className='msg-content';
  if(extra&&extra.type==='confirm'){
    const bubble=document.createElement('div');
    bubble.className='msg-bubble bot';
    bubble.style.cssText='padding:0;background:transparent;border:none;';
    const card=document.createElement('div');card.className='confirm-card';
    card.innerHTML=`<div class="confirm-card-header">Проверьте данные</div>
      <div class="confirm-card-body">
        <div class="confirm-row"><span class="ck">Услуга</span><span class="cv">${extra.d.service}</span></div>
        <div class="confirm-row"><span class="ck">Время</span><span class="cv">${extra.d.time}</span></div>
        <div class="confirm-row"><span class="ck">Имя</span><span class="cv">${extra.d.name}</span></div>
        <div class="confirm-row"><span class="ck">Телефон</span><span class="cv">${extra.d.phone}</span></div>
      </div>
      <div class="confirm-actions">
        <button class="btn-yes" onclick="confirm_(true)">Подтвердить</button>
        <button class="btn-no" onclick="confirm_(false)">Изменить</button>
      </div>`;
    bubble.appendChild(card);col.appendChild(bubble);
  } else {
    const bubble=document.createElement('div');bubble.className='msg-bubble';bubble.textContent=text;col.appendChild(bubble);
  }
  const t=document.createElement('div');t.className='msg-time';t.textContent=now();col.appendChild(t);
  row.appendChild(col);msgsEl.appendChild(row);msgsEl.scrollTop=msgsEl.scrollHeight;
  convMessages.push({role,text,time:now()});
}

function showTyping(){
  const row=document.createElement('div');row.className='msg-row bot';row.id='typing';
  const av=document.createElement('div');av.className='msg-avatar';av.textContent='D';row.appendChild(av);
  const t=document.createElement('div');t.className='typing-bubble';
  t.innerHTML='<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
  row.appendChild(t);msgsEl.appendChild(row);msgsEl.scrollTop=msgsEl.scrollHeight;
}
function removeTyping(){const t=document.getElementById('typing');if(t)t.remove();}

function setQR(items){
  qrEl.innerHTML='';
  items.forEach(text=>{
    const btn=document.createElement('button');btn.className='qr-chip';btn.textContent=text;
    btn.onclick=()=>sendMsg(text);qrEl.appendChild(btn);
  });
}

function parseBooking(text){
  const m=text.match(/ЗАПИСЬ_ГОТОВА:\s*(.+?)\s*\|\s*(.+?)\s*\|\s*(.+?)\s*\|\s*(.+)/);
  if(!m)return null;
  return{service:m[1].trim(),time:m[2].trim(),name:m[3].trim(),phone:m[4].trim()};
}

async function sendMsg(text){
  if(!text.trim())return;
  qrEl.innerHTML='';
  addMsg(text,'user');
  history.push({role:'user',content:text});
  inputEl.value='';showTyping();
  try{
    const res=await fetch(WORKER,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:1000,system:SYSTEM,messages:history})});
    const data=await res.json();
    const reply=data.content?.[0]?.text||'Произошла ошибка. Попробуйте ещё раз.';
    removeTyping();
    const booking=parseBooking(reply);
    if(booking){
      pendingBooking=booking;
      const clean=reply.replace(/ЗАПИСЬ_ГОТОВА:.*/,'').trim();
      if(clean)addMsg(clean,'bot');
      addMsg('','bot',{type:'confirm',d:booking});
    } else {
      addMsg(reply,'bot');
    }
    history.push({role:'assistant',content:reply});
    if(history.length<=2)setQR(['Записаться на чистку','Цены на лечение','Наши врачи','Адрес клиники']);
    // Send booking to admin
    if(booking){
      try{
        const bc=convMessages.map(m=>m);
        localStorage.setItem('booking_'+Date.now(),JSON.stringify({...booking,status:'new',createdAt:new Date().toISOString(),conversation:bc}));
      }catch(e){}
    }
  }catch(e){removeTyping();addMsg('Ошибка соединения. Попробуйте позже.','bot');}
}

window.confirm_=function(yes){
  if(yes&&pendingBooking){
    // Save to localStorage for admin
    const id='bk_'+Date.now();
    const entry={id,...pendingBooking,status:'new',createdAt:new Date().toISOString(),conversation:[...convMessages]};
    try{
      const existing=JSON.parse(localStorage.getItem('smilecare_bookings')||'[]');
      existing.unshift(entry);
      localStorage.setItem('smilecare_bookings',JSON.stringify(existing));
    }catch(e){}
    const msg=`Отлично, ${pendingBooking.name}! Запись подтверждена.\n\nЖдём вас в SmileCare. SMS с подтверждением придёт на ${pendingBooking.phone}. 🦷`;
    addMsg(msg,'bot');history.push({role:'assistant',content:msg});
    setQR(['Записать ещё кого-то','Узнать другие услуги']);
  } else {
    addMsg('Конечно! Что хотите изменить?','bot');
    history.push({role:'assistant',content:'Конечно! Что хотите изменить?'});
  }
  pendingBooking=null;
};

inputEl.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();sendMsg(inputEl.value);}});
document.getElementById('send-btn').onclick=()=>sendMsg(inputEl.value);

(async()=>{
  await new Promise(r=>setTimeout(r,700));
  showTyping();await new Promise(r=>setTimeout(r,900));removeTyping();
  const g='Добрый день! Я Diana, ассистент клиники SmileCare 🦷\n\nПомогу записаться на приём, отвечу на вопросы о ценах и врачах. Чем могу помочь?';
  addMsg(g,'bot');history.push({role:'assistant',content:g});
  setQR(['Записаться на приём','Узнать цены','Наши врачи','Адрес и график']);
})();
</script>
</body>
</html>
