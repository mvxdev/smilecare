<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SmileCare — Панель администратора</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --green:#1a6b4a;--green-light:#f0f7f4;--green-mid:#e0f0e9;--green-dark:#134f37;
  --text:#1a1a1a;--text-muted:#6b7280;--text-hint:#9ca3af;
  --border:#e5e7eb;--bg:#fff;--surface:#f9fafb;--surface2:#f3f4f6;
  --radius:12px;--shadow:0 1px 3px rgba(0,0,0,0.06);
}
body{font-family:'Inter',sans-serif;background:var(--surface);color:var(--text);min-height:100vh;display:flex;flex-direction:column;}

/* NAV */
.nav{background:#fff;border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;gap:16px;height:56px;position:sticky;top:0;z-index:100;}
.nav-logo{font-size:16px;font-weight:600;color:var(--green);}
.nav-logo span{color:var(--text-muted);font-weight:400;font-size:13px;margin-left:6px;}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.btn-refresh{padding:6px 14px;border:1px solid var(--border);border-radius:8px;font-size:12px;font-weight:500;background:var(--surface);color:var(--text-muted);cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.15s;}
.btn-refresh:hover{background:var(--border);}

/* STATS */
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px 24px;background:#fff;border-bottom:1px solid var(--border);}
.stat-item{text-align:center;}
.stat-value{font-size:24px;font-weight:600;color:var(--text);}
.stat-value.green{color:var(--green);}
.stat-label{font-size:11px;color:var(--text-muted);margin-top:2px;}

/* LAYOUT */
.admin-wrap{display:flex;flex:1;overflow:hidden;height:calc(100vh - 108px);}

/* SIDEBAR */
.sidebar{width:300px;flex-shrink:0;background:#fff;border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.sidebar-header{padding:14px 16px 10px;border-bottom:1px solid var(--border);}
.sidebar-title{font-size:13px;font-weight:600;margin-bottom:10px;}
.filter-tabs{display:flex;gap:4px;}
.filter-tab{padding:4px 10px;border-radius:6px;font-size:11px;font-weight:500;cursor:pointer;border:none;background:var(--surface2);color:var(--text-muted);transition:all 0.15s;font-family:'Inter',sans-serif;}
.filter-tab.active{background:var(--green);color:#fff;}
.booking-list{flex:1;overflow-y:auto;padding:8px;}
.booking-list::-webkit-scrollbar{width:4px;}
.booking-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.booking-item{padding:11px 12px;border-radius:10px;cursor:pointer;transition:all 0.15s;border:1px solid transparent;margin-bottom:4px;}
.booking-item:hover{background:var(--surface);}
.booking-item.active{background:var(--green-light);border-color:rgba(26,107,74,0.15);}
.booking-item-top{display:flex;justify-content:space-between;margin-bottom:4px;}
.booking-item-name{font-size:13px;font-weight:600;}
.booking-item-time{font-size:11px;color:var(--text-hint);}
.booking-item-service{font-size:12px;color:var(--text-muted);margin-bottom:5px;}
.booking-item-bottom{display:flex;align-items:center;gap:6px;}
.status-badge{font-size:10px;font-weight:600;padding:2px 8px;border-radius:10px;}
.status-new{background:#fef3c7;color:#92400e;}
.status-confirmed{background:#d1fae5;color:#065f46;}
.status-cancelled{background:#fee2e2;color:#991b1b;}
.booking-lang{font-size:10px;color:var(--text-hint);margin-left:auto;}
.empty-list{padding:32px 16px;text-align:center;color:var(--text-hint);font-size:13px;}

/* MAIN */
.admin-main{flex:1;overflow-y:auto;background:var(--surface);}
.admin-main::-webkit-scrollbar{width:6px;}
.admin-main::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
.detail-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-hint);gap:10px;}
.detail-empty svg{width:40px;height:40px;opacity:0.3;}
.detail-wrap{padding:24px;}

/* DETAIL */
.detail-header{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px;display:flex;align-items:flex-start;gap:16px;}
.detail-avatar{width:48px;height:48px;border-radius:50%;background:var(--green-light);color:var(--green);font-size:18px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.detail-name{font-size:17px;font-weight:600;margin-bottom:4px;}
.detail-meta{font-size:12px;color:var(--text-muted);display:flex;gap:12px;flex-wrap:wrap;}
.detail-actions{margin-left:auto;display:flex;gap:8px;flex-shrink:0;}
.action-btn{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;font-family:'Inter',sans-serif;transition:all 0.15s;border:none;}
.action-btn.primary{background:var(--green);color:#fff;}
.action-btn.primary:hover{background:var(--green-dark);}
.action-btn.danger{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5;}
.action-btn.danger:hover{background:#fca5a5;}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.detail-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px;}
.detail-card-title{font-size:11px;font-weight:600;color:var(--text-hint);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:12px;}
.detail-field{margin-bottom:10px;}
.detail-field:last-child{margin-bottom:0;}
.detail-field-label{font-size:11px;color:var(--text-muted);margin-bottom:3px;}
.detail-field-value{font-size:13.5px;font-weight:500;}
.detail-field-value.green{color:var(--green);}
.conv-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px;overflow:hidden;}
.conv-card-header{padding:12px 16px;border-bottom:1px solid var(--border);font-size:11px;font-weight:600;color:var(--text-hint);text-transform:uppercase;letter-spacing:0.5px;display:flex;justify-content:space-between;align-items:center;}
.conv-msgs{padding:16px;display:flex;flex-direction:column;gap:10px;}
.conv-msg{display:flex;gap:8px;}
.conv-msg.user-msg{flex-direction:row-reverse;}
.conv-msg-avatar{width:24px;height:24px;border-radius:50%;font-size:9px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;}
.bot-av{background:var(--green-light);color:var(--green);}
.user-av{background:var(--surface2);color:var(--text-muted);}
.conv-msg-body{max-width:75%;}
.conv-msg-bubble{padding:8px 11px;font-size:12.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word;}
.bot-bubble{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:3px 10px 10px 10px;}
.user-bubble{background:var(--green);color:#fff;border-radius:10px 3px 10px 10px;}
.user-msg .conv-msg-bubble{border-radius:10px 3px 10px 10px;}
.conv-msg-time{font-size:10px;color:var(--text-hint);margin-top:2px;padding:0 2px;}
.user-msg .conv-msg-time{text-align:right;}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-logo">SmileCare <span>Панель администратора</span></div>
  <div class="nav-right">
    <button class="btn-refresh" onclick="loadBookings()">↻ Обновить</button>
  </div>
</nav>

<div class="stats-bar">
  <div class="stat-item"><div class="stat-value green" id="stat-total">0</div><div class="stat-label">Всего записей</div></div>
  <div class="stat-item"><div class="stat-value" style="color:#f59e0b" id="stat-new">0</div><div class="stat-label">Новых</div></div>
  <div class="stat-item"><div class="stat-value" style="color:#10b981" id="stat-confirmed">0</div><div class="stat-label">Подтверждённых</div></div>
  <div class="stat-item"><div class="stat-value" style="color:#6b7280" id="stat-today">0</div><div class="stat-label">Сегодня</div></div>
</div>

<div class="admin-wrap">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-title">Записи на приём</div>
      <div class="filter-tabs">
        <button class="filter-tab active" onclick="filterBookings('all',this)">Все</button>
        <button class="filter-tab" onclick="filterBookings('new',this)">Новые</button>
        <button class="filter-tab" onclick="filterBookings('confirmed',this)">Подтв.</button>
      </div>
    </div>
    <div class="booking-list" id="booking-list"></div>
  </div>

  <div class="admin-main" id="admin-main">
    <div class="detail-empty" id="detail-empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      <p>Выберите запись для просмотра</p>
    </div>
    <div class="detail-wrap" id="detail-wrap" style="display:none;"></div>
  </div>
</div>

<script>
// Demo bookings + localStorage
const DEMO = [
  {id:'demo1',name:'Мария Иванова',phone:'+373 69 123 456',service:'Профессиональная чистка',time:'Пятница 16:00',status:'new',lang:'ru',createdAt:new Date(Date.now()-8*60000).toISOString(),
   conversation:[
    {role:'bot',text:'Добрый день! Я Diana, ассистент клиники SmileCare. Чем могу помочь?',time:'14:52'},
    {role:'user',text:'Хочу записаться на чистку зубов',time:'14:53'},
    {role:'bot',text:'Отлично! Профессиональная чистка стоит 800 MDL, занимает около часа. Какой день вам удобен?',time:'14:53'},
    {role:'user',text:'Пятница в 16:00',time:'14:54'},
    {role:'bot',text:'Скажите ваше имя и номер телефона.',time:'14:54'},
    {role:'user',text:'Мария Иванова, +373 69 123 456',time:'14:55'},
    {role:'bot',text:'Мария, записала вас на пятницу в 16:00 на чистку. До встречи в SmileCare! 🦷',time:'14:55'}
  ]},
  {id:'demo2',name:'Alexandru Popescu',phone:'+373 79 234 567',service:'Consultație implant',time:'Joi 11:00',status:'confirmed',lang:'ro',createdAt:new Date(Date.now()-35*60000).toISOString(),
   conversation:[
    {role:'bot',text:'Bună ziua! Sunt Diana, asistentul SmileCare. Cu ce vă pot ajuta?',time:'14:20'},
    {role:'user',text:'Vreau să mă interesez despre implant dentar',time:'14:21'},
    {role:'bot',text:'Implantul dentar începe de la 12 000 MDL. Vă recomand o consultație gratuită cu Dr. Andrei Lungu. Vă convine joi?',time:'14:21'},
    {role:'user',text:'Da, joi la 11:00. Alexandru Popescu, 079234567',time:'14:22'},
    {role:'bot',text:'Alexandru, v-am înregistrat pentru joi la 11:00. Ne vedem la SmileCare! 🦷',time:'14:23'}
  ]},
  {id:'demo3',name:'Елена Константинова',phone:'+373 60 345 678',service:'Лечение кариеса',time:'Среда 10:30',status:'new',lang:'ru',createdAt:new Date(Date.now()-2*3600000).toISOString(),
   conversation:[
    {role:'bot',text:'Добрый день! Я Diana, ассистент SmileCare. Чем могу помочь?',time:'12:55'},
    {role:'user',text:'Болит зуб уже 3 дня',time:'12:56'},
    {role:'bot',text:'Постараемся помочь быстро! Dr. Marina Cebotari примет вас в среду в 10:30. Лечение кариеса 600-1200 MDL.',time:'12:56'},
    {role:'user',text:'Да, подходит. Елена Константинова, +373 60 345 678',time:'12:57'},
    {role:'bot',text:'Елена, записала вас на среду в 10:30. До встречи! 🦷',time:'12:57'}
  ]}
];

let allBookings = [];
let currentFilter = 'all';
let currentId = null;

function loadBookings() {
  // Load from localStorage (real bookings from widget)
  let stored = [];
  try {
    stored = JSON.parse(localStorage.getItem('smilecare_bookings') || '[]');
    stored = stored.map(b => ({...b, createdAt: new Date(b.createdAt)}));
  } catch(e) {}
  // Merge with demo
  const demoWithDates = DEMO.map(b => ({...b, createdAt: new Date(b.createdAt)}));
  allBookings = [...stored, ...demoWithDates];
  updateStats();
  renderList();
}

function updateStats() {
  document.getElementById('stat-total').textContent = allBookings.length;
  document.getElementById('stat-new').textContent = allBookings.filter(b=>b.status==='new').length;
  document.getElementById('stat-confirmed').textContent = allBookings.filter(b=>b.status==='confirmed').length;
  const today = new Date().toDateString();
  document.getElementById('stat-today').textContent = allBookings.filter(b=>new Date(b.createdAt).toDateString()===today).length;
}

function filterBookings(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderList();
}

function renderList() {
  const list = document.getElementById('booking-list');
  const filtered = currentFilter === 'all' ? allBookings : allBookings.filter(b=>b.status===currentFilter);
  if (!filtered.length) { list.innerHTML = '<div class="empty-list">Нет записей</div>'; return; }
  list.innerHTML = '';
  filtered.forEach(b => {
    const el = document.createElement('div');
    el.className = 'booking-item' + (b.id === currentId ? ' active' : '');
    const mins = Math.round((Date.now() - new Date(b.createdAt)) / 60000);
    const ago = mins < 60 ? `${mins} мин назад` : `${Math.round(mins/60)} ч назад`;
    const sLabel = {new:'Новый',confirmed:'Подтверждён',cancelled:'Отменён'}[b.status];
    const sClass = {new:'status-new',confirmed:'status-confirmed',cancelled:'status-cancelled'}[b.status];
    el.innerHTML = `
      <div class="booking-item-top"><span class="booking-item-name">${b.name}</span><span class="booking-item-time">${ago}</span></div>
      <div class="booking-item-service">${b.service} · ${b.time}</div>
      <div class="booking-item-bottom">
        <span class="status-badge ${sClass}">${sLabel}</span>
        <span class="booking-lang">${b.lang==='ro'?'🇷🇴 RO':'🇷🇺 RU'}</span>
      </div>`;
    el.onclick = () => showDetail(b.id);
    list.appendChild(el);
  });
}

function showDetail(id) {
  currentId = id;
  renderList();
  const b = allBookings.find(x=>x.id===id);
  if (!b) return;
  document.getElementById('detail-empty').style.display = 'none';
  const wrap = document.getElementById('detail-wrap');
  wrap.style.display = 'block';
  const initials = b.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  const sLabel = {new:'Новый',confirmed:'Подтверждён',cancelled:'Отменён'}[b.status];
  const sClass = {new:'status-new',confirmed:'status-confirmed',cancelled:'status-cancelled'}[b.status];
  const mins = Math.round((Date.now() - new Date(b.createdAt)) / 60000);
  const ago = mins < 60 ? `${mins} мин назад` : `${Math.round(mins/60)} ч назад`;
  const convHtml = (b.conversation||[]).map(m=>`
    <div class="conv-msg ${m.role==='user'?'user-msg':''}">
      <div class="conv-msg-avatar ${m.role==='bot'?'bot-av':'user-av'}">${m.role==='bot'?'D':'П'}</div>
      <div class="conv-msg-body">
        <div class="conv-msg-bubble ${m.role==='bot'?'bot-bubble':'user-bubble'}">${m.text}</div>
        <div class="conv-msg-time">${m.time}</div>
      </div>
    </div>`).join('');
  wrap.innerHTML = `
    <div class="detail-header">
      <div class="detail-avatar">${initials}</div>
      <div style="flex:1">
        <div class="detail-name">${b.name}</div>
        <div class="detail-meta">
          <span>📞 ${b.phone}</span>
          <span>🕐 ${ago}</span>
          <span>${b.lang==='ro'?'🇷🇴 Română':'🇷🇺 Русский'}</span>
          <span class="status-badge ${sClass}">${sLabel}</span>
        </div>
      </div>
      <div class="detail-actions">
        ${b.status==='new'?`<button class="action-btn primary" onclick="changeStatus('${b.id}','confirmed')">✓ Подтвердить</button>`:''}
        ${b.status!=='cancelled'?`<button class="action-btn danger" onclick="changeStatus('${b.id}','cancelled')">Отменить</button>`:''}
      </div>
    </div>
    <div class="detail-grid">
      <div class="detail-card">
        <div class="detail-card-title">Данные записи</div>
        <div class="detail-field"><div class="detail-field-label">Услуга</div><div class="detail-field-value green">${b.service}</div></div>
        <div class="detail-field"><div class="detail-field-label">Дата и время</div><div class="detail-field-value">${b.time}</div></div>
        <div class="detail-field"><div class="detail-field-label">Статус</div><div class="detail-field-value"><span class="status-badge ${sClass}">${sLabel}</span></div></div>
      </div>
      <div class="detail-card">
        <div class="detail-card-title">Пациент</div>
        <div class="detail-field"><div class="detail-field-label">Имя</div><div class="detail-field-value">${b.name}</div></div>
        <div class="detail-field"><div class="detail-field-label">Телефон</div><div class="detail-field-value">${b.phone}</div></div>
        <div class="detail-field"><div class="detail-field-label">Язык</div><div class="detail-field-value">${b.lang==='ro'?'Română':'Русский'}</div></div>
      </div>
    </div>
    <div class="conv-card">
      <div class="conv-card-header">История разговора <span style="font-weight:400;color:var(--text-muted)">${(b.conversation||[]).length} сообщений</span></div>
      <div class="conv-msgs">${convHtml}</div>
    </div>`;
}

window.changeStatus = function(id, status) {
  const b = allBookings.find(x=>x.id===id);
  if (b) {
    b.status = status;
    // Update localStorage if real booking
    try {
      const stored = JSON.parse(localStorage.getItem('smilecare_bookings')||'[]');
      const idx = stored.findIndex(x=>x.id===id);
      if (idx>=0) { stored[idx].status=status; localStorage.setItem('smilecare_bookings',JSON.stringify(stored)); }
    } catch(e) {}
    updateStats(); renderList(); showDetail(id);
  }
};

loadBookings();
setInterval(loadBookings, 30000); // Auto-refresh every 30s
</script>
</body>
</html>
